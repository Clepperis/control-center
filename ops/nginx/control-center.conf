# Reviewed template. Replace the single hostname only after DNS authorization.
# No existing public proxy was found during the read-only inventory. nginx is
# proposed ONLY if the final preflight still confirms there is none to reuse.
limit_req_zone $binary_remote_addr zone=cc_entry:1m rate=10r/s;
server {
    listen 80;
    server_name HOSTNAME_PENDING.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/lib/control-center/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name HOSTNAME_PENDING.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/HOSTNAME_PENDING.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/HOSTNAME_PENDING.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    client_body_timeout 15s;
    # Do not persist private paths, query strings, or authentication requests.
    access_log off;
    error_log /var/log/nginx/control-center-error.log crit;
    location /api/ready { return 404; }
    location / {
        limit_req zone=cc_entry burst=20 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host HOSTNAME_PENDING.duckdns.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User "";
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
